# ============================================================
# AE2 UEL Addon - Gradle Configuration
# ============================================================

modName = AE2 UEL Addon Example
modId = ae2ueladdon
modGroup = com.example.ae2uel

# Mod Version Settings
modVersion = 1.0.0
includeMCVersionJar = false
modArchivesBaseName = ae2-uel-addon

# Minecraft and Forge Configuration
minecraftVersion = 1.12.2
apiPackage = api
useSrcApiPath = true

# Development Environment
developmentEnvironmentUserName = Developer

# Java and Syntax Configuration
enableModernJavaSyntax = true

# Gradle Token Generation (for @Mod annotation)
generateGradleTokenClass = com.example.ae2uel.Tags
gradleTokenModId = MODID
gradleTokenModName = MODNAME
gradleTokenVersion = VERSION

# Access Transformers
accessTransformersFile = ae2ueladdon_at.cfg

# Mixins (disabled by default, enable if needed)
usesMixins = false
mixinsPackage =
generateMixinConfig = false

# Core Mod (disabled)
coreModClass =
containsMixinsAndOrCoreModOnly = false

# Repository Configuration
includeWellKnownRepositories = true
includeCommonDevEnvMods = true

# Dependencies
usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true

# Run Configuration
separateRunDirectories = false

# Display and Publishing
versionDisplayFormat = $MOD_NAME - $VERSION
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =
releaseType = release
generateDefaultChangelog = false
noPublishedSources = false

# Code Style
enableSpotless = false
enableJUnit = true

# Gradle Settings
org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx3G
